{% extends 'base-novo.html'%}

{% block 'titulo'%}
Area Aluno

{% endblock%}
{% block 'body' %}


    <main class="container text-center">
    
        
            <div class="box text-center logar">
                <form method="POST">{% csrf_token %}
                    <div class="logar-form">
                    <h1 class="titulo font-degrade borda-bottom-degrade">Meu Perfil</h2>
                    <br>
                    <br>
                    <span class="span-descricao"></span>
                    <label for="name">Nome</label>
                    <input type="text" class="form-control input-cadastro" value="{{first_name}}" name="first_name" placeholder="nome de usuário">
                    <br>
                    <span class="span-descricao"></span>
                    <label for="name">CPF</label>
                    <input type="text" class="form-control input-cadastro" data-mask="000.000.000-00"  value="{{cpf}}" name="cpf" id="cpf" placeholder="CPF">
                    <br>
                    <span class="span-descricao"></span>
                    <label for="name">Email</label>
                    <input type="text" class="form-control input-cadastro" value="{{email}}" name="email" placeholder="Email">
                    <br>
                    <span class="span-descricao"></span>
                    <br>
                    <span class="span-descricao"></span>
                </div>
                    <br>
                    <input  type="submit" value="Alterar" class="btn btn-success">
                    
                </form>
                    
            </div>
 <br>
        {% if messages %}
        {% for message in messages %}
            <div class="alert {{message.tags}}">
                {{message}}
            </div>
        {% endfor %}
        {% endif %}
          
         
        
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
            <script src="https://harvesthq.github.io/chosen/chosen.jquery.js" type="text/javascript"></script>

        </div>
    </main>

    <style>
        .logar-form {
    padding-top: 150px;
}


form {
    position: relative;
    z-index: 1;
}
    </style>

{%endblock%}
